[package]
name = "unshift"
version = "0.1.0"
edition = "2024"

[lib]
path="src/lib.rs"
name="kernel"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "tracing"] }
dotenvy = "0.15.7"
rdkafka = { version = "0.39.0", features = ["ssl", "curl"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.2", features = ["limit", "timeout"] }
tower-http = { version = "0.7.0", features = ["limit", "fs", "trace", "cors", "timeout", "sensitive-headers", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ts-rs = "12.0.1"
